<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>HeroMail 工作台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__HEROMAIL_ASSET_VERSION__">
  <link rel="stylesheet" href="/styles.css?v=__HEROMAIL_ASSET_VERSION__">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <a class="brand" href="/admin"><img class="brand-logo" src="/brand-mark.svg?v=__HEROMAIL_ASSET_VERSION__" alt=""><span>HeroMail</span><small id="role-label">管理员端</small></a>
      <nav id="nav" aria-label="管理后台导航"></nav>
      <div class="sidebar-foot"><span>MIT 开源</span><span id="app-version">正式版</span></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <a class="portal-brand" href="/app"><img src="/brand-mark.svg?v=__HEROMAIL_ASSET_VERSION__" alt=""><strong>HeroMail</strong></a>
        <nav id="user-nav" class="user-nav" aria-label="用户门户导航"></nav>
        <div class="topbar-actions">
          <a class="role-switch" id="role-switch" href="/admin" title="切换工作区"><span id="role-action">管理后台</span><span class="chevron">→</span></a>
          <span class="top-status"><i></i> 服务正常</span>
          <span id="balance" class="balance">余额 ¥0.00</span>
          <button class="avatar" data-action="view" data-view="settings" title="账户设置">U</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动端用户导航"></nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=__HEROMAIL_ASSET_VERSION__" defer></script>
</body>
</html>
