<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeroMail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__HEROMAIL_ASSET_VERSION__">
  <link rel="stylesheet" href="/styles.css?v=__HEROMAIL_ASSET_VERSION__">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>HeroMail</span><small id="role-label">用户端</small></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><span>MIT 开源</span><span id="app-version">正式版</span></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="mobile-title">HeroMail</div>
        <div class="topbar-actions">
          <button class="role-switch" data-action="role" title="切换工作台"><span id="role-action">切换管理员端</span><span class="chevron">⌄</span></button>
          <span class="top-status"><i></i> 服务正常</span>
          <span id="balance" class="balance">余额 ¥48.60</span>
          <span class="avatar">U</span>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=__HEROMAIL_ASSET_VERSION__" defer></script>
</body>
</html>
